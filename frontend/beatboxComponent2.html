<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haptix - Visualizer</title>
    
    <!-- Fonts and Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- p5.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #9d4edd;
            --primary-light: #c77dff;
            --secondary: #ff0a54;
            --bg-dark: #0b0c10;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-blur: blur(12px);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            overflow: hidden;
            transition: background-color 0.2s ease;
        }

        /* Canvas Container */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* UI Layer - All controls on top of canvas */
        #ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 2rem 1.5rem;
        }

        /* Top Bar */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .back-btn {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            color: var(--text-light);
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .back-btn i {
            font-size: 1rem;
            color: var(--primary-light);
        }

        .back-btn:hover {
            background: rgba(157, 78, 221, 0.2);
            border-color: var(--primary-light);
            transform: translateX(-5px);
        }

        .mode-badge {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .mode-badge i {
            font-size: 1rem;
        }

        .mode-badge.live i {
            color: #ff0a54;
        }

        .mode-badge.file i {
            color: #4aff4a;
        }

        .file-info {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .file-info i {
            color: var(--primary-light);
        }

        /* Center Content */
        .center-content {
            text-align: center;
            pointer-events: auto;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .main-title {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 800;
            letter-spacing: -1.5px;
            background: linear-gradient(135deg, #ffffff, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
            text-shadow: 0 10px 30px rgba(157, 78, 221, 0.3);
        }

        .status-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        #status {
            font-size: 1.3rem;
            font-weight: 500;
            color: var(--text-light);
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .level-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 1rem;
            border: 1px solid var(--glass-border);
        }

        .level-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .level-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-light);
            line-height: 1;
        }

        .level-value span {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .vibe-value {
            color: var(--secondary);
        }

        .emoji-value {
            font-size: 2.5rem !important;
            line-height: 1;
        }

        .start-btn {
            background: linear-gradient(270deg, var(--primary), var(--secondary), var(--primary));
            background-size: 200% auto;
            color: white;
            border: none;
            padding: 1.2rem 2.5rem;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(157, 78, 221, 0.3);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            pointer-events: auto;
            min-width: 250px;
            animation: gradientShift 4s ease infinite;
        }

        .start-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 35px rgba(255, 10, 84, 0.5), 0 0 30px rgba(157, 78, 221, 0.6);
        }

        .start-btn:active {
            transform: scale(0.98);
        }

        .start-btn i {
            font-size: 1rem;
        }

        .start-btn .record-dot {
            color: #ff4a4a;
            animation: pulse 1.2s infinite;
        }

        /* Bottom Bar */
        .bottom-bar {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            pointer-events: auto;
            flex-wrap: wrap;
        }

        .vibration-status {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .vibration-status.supported {
            color: #4aff4a;
        }

        .vibration-status.unsupported {
            color: #ff4a4a;
        }

        .vibration-status i {
            font-size: 1rem;
        }

        .vibration-toggle {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            color: var(--text-light);
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .vibration-toggle:hover {
            background: rgba(157, 78, 221, 0.2);
            border-color: var(--primary-light);
        }

        .vibration-toggle.enabled i {
            color: #4aff4a;
        }

        .vibration-toggle.disabled i {
            color: #ff4a4a;
        }

        /* Audio Player */
        #audio-player-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: 90%;
            max-width: 600px;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 60px;
            padding: 0.8rem 1.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
            display: none;
        }

        #audio-player {
            width: 100%;
            height: 40px;
            border-radius: 20px;
        }

        /* Animations */
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.7; }
            100% { transform: scale(1.2); opacity: 1; text-shadow: 0 0 15px #ff4a4a; }
        }

        /* Hide elements */
        .hidden {
            display: none !important;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .file-info {
                max-width: 100%;
            }

            .level-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .bottom-bar {
                flex-direction: column;
                width: 100%;
            }

            .vibration-status, .vibration-toggle {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- UI Layer -->
    <div id="ui-layer">
        <!-- Top Bar -->
        <div class="top-bar">
            <button class="back-btn" onclick="window.location.href='index.html'">
                <i class="fas fa-arrow-left"></i>
                <span>Back to Home</span>
            </button>

            <div id="mode-badge" class="mode-badge">
                <i class="fas fa-circle" id="mode-icon"></i>
                <span id="mode-text">Initializing...</span>
            </div>

            <div id="file-info" class="file-info" style="display: none;">
                <i class="fas fa-music"></i>
                <span id="file-name">Loading...</span>
            </div>
        </div>

        <!-- Center Content -->
        <div class="center-content">
            <h1 class="main-title">Haptix</h1>
            
            <div class="status-card">
                <div id="status">Ready to start</div>
                
                <div class="level-grid">
                    <div class="level-item">
                        <div class="level-label">Bass Level</div>
                        <div class="level-value" id="bass-value">0</div>
                    </div>
                    <div class="level-item">
                        <div class="level-label">Energy Level</div>
                        <div class="level-value" id="current-level">1/<span>16</span></div>
                    </div>
                    <div class="level-item">
                        <div class="level-label">Vibration</div>
                        <div class="level-value vibe-value" id="vibe-level">0<span>ms</span></div>
                    </div>
                    <div class="level-item">
                        <div class="level-label">Mood</div>
                        <div class="level-value emoji-value" id="mood-emoji">😴</div>
                    </div>
                </div>
            </div>

            <button id="startBtn" class="start-btn">
                <i class="fas fa-circle record-dot" id="start-icon"></i>
                <span id="start-text">Begin Experience</span>
            </button>
        </div>

        <!-- Bottom Bar -->
        <div class="bottom-bar">
            <div id="vibration-status" class="vibration-status">
                <i class="fas fa-mobile-alt"></i>
                <span id="vibration-text">Checking support...</span>
            </div>

            <button id="vibration-toggle" class="vibration-toggle enabled">
                <i class="fas fa-bell"></i>
                <span id="toggle-text">Vibration: ON</span>
            </button>
        </div>
    </div>

    <!-- Audio Player (for file playback) -->
    <div id="audio-player-container">
        <audio id="audio-player" controls>
            Your browser does not support the audio element.
        </audio>
    </div>

    <script>
        // ==================== STATE MANAGEMENT ====================
        let audioContext, analyser, dataArray, started = false;
        let smoothBass = 0;
        let lastVibeTime = 0;
        let vibrationSupported = false;
        let vibrationEnabled = true;
        let audioElement = null;
        let isLiveMode = false;
        let animationFrame;
        
        // Level calculation constants
        const LEVELS = 16;
        const BASS_BINS = 20; // Number of frequency bins to analyze for bass

        // ==================== UI ELEMENTS ====================
        const statusEl = document.getElementById('status');
        const bassValueEl = document.getElementById('bass-value');
        const currentLevelEl = document.getElementById('current-level');
        const vibeLevelEl = document.getElementById('vibe-level');
        const moodEmojiEl = document.getElementById('mood-emoji');
        const startBtn = document.getElementById('startBtn');
        const startText = document.getElementById('start-text');
        const startIcon = document.getElementById('start-icon');
        const modeBadge = document.getElementById('mode-badge');
        const modeIcon = document.getElementById('mode-icon');
        const modeText = document.getElementById('mode-text');
        const fileInfoDiv = document.getElementById('file-info');
        const fileNameSpan = document.getElementById('file-name');
        const vibrationStatus = document.getElementById('vibration-status');
        const vibrationText = document.getElementById('vibration-text');
        const vibrationToggle = document.getElementById('vibration-toggle');
        const toggleText = document.getElementById('toggle-text');
        const audioPlayerContainer = document.getElementById('audio-player-container');
        const audioPlayer = document.getElementById('audio-player');

        // Emoji array matching the 16 energy levels
        const levelEmojis = [
            "😴", // Level 1 - Deep sleep / calm
            "😌", // Level 2 - Peaceful
            "🙂", // Level 3 - Gentle
            "😊", // Level 4 - Warm
            "🎵", // Level 5 - Music starting
            "🎶", // Level 6 - Melodic
            "🔊", // Level 7 - Getting louder
            "💃", // Level 8 - Moving
            "🕺", // Level 9 - Dancing
            "🔥", // Level 10 - Fire
            "⚡", // Level 11 - Electric
            "💥", // Level 12 - Explosive
            "🤯", // Level 13 - Mind-blowing
            "🚀", // Level 14 - Rocket mode
            "🌈", // Level 15 - Color explosion
            "🎉"  // Level 16 - Celebration mode
        ];

        // ==================== INITIALIZATION ====================
        function initialize() {
            checkVibrationSupport();
            checkForUploadedAudio();
            updateUIForMode();
        }

        // Check vibration support
        function checkVibrationSupport() {
            if ('vibrate' in navigator) {
                vibrationSupported = true;
                vibrationStatus.classList.add('supported');
                vibrationStatus.classList.remove('unsupported');
                vibrationText.textContent = 'Vibration Supported';
                
                // Test vibration
                navigator.vibrate(50);
                setTimeout(() => navigator.vibrate(0), 100);
            } else {
                vibrationSupported = false;
                vibrationStatus.classList.add('unsupported');
                vibrationStatus.classList.remove('supported');
                vibrationText.textContent = 'Vibration Not Supported';
                vibrationToggle.style.display = 'none';
            }
        }

        // Check for uploaded audio
        function checkForUploadedAudio() {
            const urlParams = new URLSearchParams(window.location.search);
            isLiveMode = urlParams.get('mode') === 'live';
            
            if (isLiveMode) {
                modeIcon.style.color = '#ff0a54';
                modeIcon.className = 'fas fa-circle';
                modeText.textContent = 'Live Recording Mode';
                startText.textContent = 'Start Recording';
                return;
            }
            
            // Check for uploaded audio
            const storedAudio = sessionStorage.getItem('uploadedAudio');
            
            if (storedAudio) {
                try {
                    const audioData = JSON.parse(storedAudio);
                    
                    // Display file info
                    fileInfoDiv.style.display = 'flex';
                    fileNameSpan.textContent = `${audioData.name} (${Math.round(audioData.size / 1024)} KB)`;
                    
                    modeIcon.style.color = '#4aff4a';
                    modeIcon.className = 'fas fa-music';
                    modeText.textContent = 'File Playback Mode';
                    
                    // Setup audio element
                    audioElement = audioPlayer;
                    audioElement.src = audioData.data;
                    audioPlayerContainer.style.display = 'block';
                    
                    startText.textContent = 'Start Visualization';
                    
                } catch (e) {
                    console.error('Error loading audio:', e);
                    modeText.textContent = 'Error Loading File';
                }
            } else {
                // Default to live mode
                isLiveMode = true;
                modeIcon.style.color = '#ff0a54';
                modeIcon.className = 'fas fa-circle';
                modeText.textContent = 'Live Recording Mode';
                startText.textContent = 'Start Recording';
            }
        }

        function updateUIForMode() {
            if (isLiveMode) {
                startIcon.className = 'fas fa-circle record-dot';
            } else {
                startIcon.className = 'fas fa-play';
            }
        }

        // ==================== AUDIO SETUP ====================
        async function startAudio() {
            if (started) return;
            
            try {
                // Close existing context
                if (audioContext) {
                    await audioContext.close();
                }
                
                // Create new audio context
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                await audioContext.resume();
                
                let source;
                
                if (!isLiveMode && audioElement) {
                    // Use uploaded file
                    await audioElement.play();
                    source = audioContext.createMediaElementSource(audioElement);
                    statusEl.textContent = `Playing: ${fileNameSpan.textContent}`;
                } else {
                    // Use microphone
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false
                        } 
                    });
                    source = audioContext.createMediaStreamSource(stream);
                    statusEl.textContent = '🎤 Live recording active';
                }
                
                // Setup analyser
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                analyser.smoothingTimeConstant = 0.8;
                
                source.connect(analyser);
                source.connect(audioContext.destination); // THIS SENDS AUDIO TO SPEAKERS
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                // Update UI
                started = true;
                startBtn.style.opacity = '0.5';
                startBtn.style.pointerEvents = 'none';
                statusEl.style.color = 'var(--primary-light)';
                
                // Start visualization loop
                visualize();
                
            } catch (err) {
                console.error('Error starting audio:', err);
                statusEl.textContent = 'Error: ' + err.message;
                statusEl.style.color = '#ff4a4a';
            }
        }

        // ==================== VISUALIZATION ====================
        function visualize() {
            if (!started || !analyser || !dataArray) return;
            
            // Get frequency data
            analyser.getByteFrequencyData(dataArray);
            
            // Calculate bass (low frequencies)
            let bassSum = 0;
            for (let i = 0; i < BASS_BINS; i++) {
                bassSum += dataArray[i];
            }
            let averageBass = bassSum / BASS_BINS;
            
            // Smooth the bass values
            smoothBass = lerp(smoothBass, averageBass, 0.15);
            
            // Calculate level (1-16)
            let level = calculateLevel(smoothBass);
            
            // Calculate vibration intensity
            let vibeIntensity = mapLevelToVibration(level);
            
            // Apply vibration
            applyVibration(vibeIntensity);
            
            // Update UI
            updateUI(smoothBass, level, vibeIntensity);
            
            // Continue loop
            requestAnimationFrame(visualize);
        }

        function calculateLevel(bass) {
            // Map bass value (0-255) to level (1-16)
            let normalizedBass = bass / 255;
            // Apply curve for better response
            let curvedBass = Math.pow(normalizedBass, 0.7);
            let level = Math.floor(curvedBass * LEVELS) + 1;
            return Math.min(level, LEVELS);
        }

        function mapLevelToVibration(level) {
            // Map level (1-16) to vibration intensity (0-100)
            return Math.floor((level / LEVELS) * 100);
        }

function applyVibration(intensity) {
    if (!vibrationSupported || !vibrationEnabled || !started) return;

    let now = Date.now();

    // Bigger cooldown so vibration doesn't happen continuously
    if (now - lastVibeTime < 600) return;

    let pattern;

    // Ignore weak signals
    if (intensity < 40) {
        return;
    } 
    else if (intensity < 60) {
        pattern = [50]; // light beat
    } 
    else if (intensity < 75) {
        pattern = [80, 50, 80]; // medium beat
    } 
    else if (intensity < 90) {
        pattern = [120, 60, 120]; // strong beat
    } 
    else {
        pattern = [180, 80, 180, 80]; // very strong beat
    }

    navigator.vibrate(pattern);
    lastVibeTime = now;

    let totalTime = pattern.reduce((a, b) => a + b, 0);
    vibeLevelEl.innerHTML = totalTime + '<span>ms</span>';
}

        function updateUI(bass, level, vibeIntensity) {
            // Update values
            bassValueEl.textContent = Math.round(bass);
            currentLevelEl.innerHTML = level + '/<span>16</span>';
            
            // Update emoji based on level (1-16 to array index 0-15)
            if (moodEmojiEl) {
                moodEmojiEl.textContent = levelEmojis[level - 1];
            }
            
            // Update background color based on level
            updateBackgroundColor(level);
        }

        function updateBackgroundColor(level) {
            const colors = [
                "#0b0c10", // Level 1
                "#0f0f2a",
                "#13133a",
                "#17174a",
                "#1f1f5a",
                "#2a2a6a",
                "#2a3a7a",
                "#2a4a8a",
                "#2a5a9a",
                "#3a6a9a",
                "#4a7a8a",
                "#5a8a7a",
                "#7a9a6a",
                "#9aaa5a",
                "#ca9a4a",
                "#ff3a3a"  // Level 16
            ];
            
            let colorIndex = Math.min(level - 1, colors.length - 1);
            document.body.style.backgroundColor = colors[colorIndex];
            
            // Update status color
            statusEl.style.color = colors[colorIndex];
            statusEl.style.textShadow = `0 0 15px ${colors[colorIndex]}`;
            
            // Update emoji color to match theme
            if (moodEmojiEl) {
                moodEmojiEl.style.color = colors[colorIndex];
            }
        }

        // ==================== P5.js VISUALIZER ====================
        function setup() {
            let canvas = createCanvas(windowWidth, windowHeight);
            canvas.parent('canvas-container');
            colorMode(RGB);
            frameRate(30);
            
            // Initialize
            initialize();
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }

        function draw() {
            clear();
            
            if (!started || !analyser || !dataArray) {
                // Draw idle animation
                drawIdleState();
                return;
            }
            
            // Get fresh frequency data
            analyser.getByteFrequencyData(dataArray);
            
            // Draw visualizer
            drawFrequencyBars();
        }

        function drawIdleState() {
            // Draw subtle pulsing circles when idle
            let time = millis() / 1000;
            let pulse = sin(time * 2) * 0.1 + 0.9;
            
            for (let i = 0; i < 5; i++) {
                let alpha = 50 * pulse * (1 - i/5);
                let size = 100 + i * 50;
                
                fill(157, 78, 221, alpha);
                noStroke();
                circle(width/2, height/2, size);
            }
        }

        function drawFrequencyBars() {
            noStroke();
            
            let barCount = Math.floor(dataArray.length * 0.3); // Use first 30% of frequencies
            let barWidth = width / barCount;
            
            for (let i = 0; i < barCount; i++) {
                // Get frequency value
                let value = dataArray[i];
                
                // Calculate bar height with smoothing
                let barHeight = map(value, 0, 255, 5, height * 0.6);
                
                // Calculate position
                let x = i * barWidth;
                let y = height - barHeight;
                
                // Calculate color based on frequency and value
                let r = map(i, 0, barCount, 100, 255);
                let g = map(value, 0, 255, 50, 200);
                let b = map(i, 0, barCount, 255, 100);
                
                // Draw main bar
                fill(r, g, b, 200);
                rect(x, y, barWidth - 2, barHeight, 10);
                
                // Draw reflection
                fill(r, g, b, 30);
                rect(x, y - 10, barWidth - 2, 10, 5);
                
                // Draw top highlight for strong beats
                if (value > 200) {
                    fill(255, 255, 255, 100);
                    rect(x, y - 3, barWidth - 2, 3);
                }
            }
            
            // Draw energy ring based on bass
            if (smoothBass > 0) {
                let ringSize = map(smoothBass, 0, 255, 100, 300);
                let alpha = map(smoothBass, 0, 255, 0, 100);
                
                fill(157, 78, 221, alpha);
                noStroke();
                circle(width/2, height/2, ringSize);
            }
        }

        // ==================== UTILITY FUNCTIONS ====================
        function lerp(start, end, amount) {
            return (1 - amount) * start + amount * end;
        }

        // ==================== EVENT LISTENERS ====================
        startBtn.addEventListener('click', startAudio);

        vibrationToggle.addEventListener('click', () => {
            vibrationEnabled = !vibrationEnabled;
            
            if (!vibrationEnabled && vibrationSupported) {
                navigator.vibrate(0);
            }
            
            if (vibrationEnabled) {
                vibrationToggle.classList.remove('disabled');
                vibrationToggle.classList.add('enabled');
                toggleText.textContent = 'Vibration: ON';
            } else {
                vibrationToggle.classList.remove('enabled');
                vibrationToggle.classList.add('disabled');
                toggleText.textContent = 'Vibration: OFF';
            }
        });

        // Stop vibration when page is hidden
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && vibrationSupported) {
                navigator.vibrate(0);
            }
        });

        // Clean up on unload
        window.addEventListener('beforeunload', () => {
            if (vibrationSupported) {
                navigator.vibrate(0);
            }
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
            }
        });

        // Initialize everything
        initialize();
    </script>
</body>
</html>
