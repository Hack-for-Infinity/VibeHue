<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Audio Capture - Haptix</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="wrapper">
        <header>
            <h1>Live Audio Capture</h1>
            <p class="tagline">Microphone input will be analyzed in real-time here.</p>
        </header>

        <main>
            <div style="text-align: center; margin-top: 2rem;">
                <i class="fas fa-microphone" style="font-size: 5rem; margin-bottom: 2rem; color: #ff0a54;"></i>
                <h2 style="margin-bottom: 1rem; color: #fff;">Awaiting Microphone Connection...</h2>
                <p style="color: var(--text-muted); margin-bottom: 3rem; font-size: 1.1rem; max-width: 500px;">
                    This page is dedicated to handling live microphone stream capture, analyzing frequencies locally in
                    the browser, and outputting to the canvas visualizer.
                </p>
                <a href="index.html" class="btn-primary" style="display: inline-flex; width: auto;">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </a>
            </div>
        </main>
    </div>

</html>
